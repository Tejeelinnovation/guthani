name: Publish Anuroop Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=dev
          npm install --no-save @vitejs/plugin-react@5.1.1 @tailwindcss/vite@4.1.17 tailwindcss@4.1.17 vite@7.3.2 vite-plugin-singlefile@2.3.0 typescript@5.9.3

      - name: Build production site
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish dist to gh-pages branch
        run: |
          cd dist
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Anuroop website"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
